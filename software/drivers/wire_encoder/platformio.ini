; PlatformIO Project Configuration File
;
; Wire encoder driver: absolute window-opening readout from a draw-wire
; encoder's 10 kΩ potentiometer, 10-bit ratiometric ADC on PA2 (TDS §3.4),
; plus a HIL test shell. CH32V003J4M6, ch32v003fun framework, WCH-LinkE over
; SDI. Cloned from software/drivers/blinky_template per
; design/driverDevelopment.md.
;
; NOTE: the driver itself is NOT WRITTEN — lib/we/ holds the API contract
; (we.h) with no implementation. Building this project gives you the test
; shell only; see README.md.

[env:genericCH32V003J4M6]
platform      = ch32v
board         = genericCH32V003J4M6
framework     = ch32v003fun

upload_protocol = wch-link

; Shared driver-phase libraries (debug_uart). The we driver itself belongs in
; this project's lib/ folder.
lib_extra_dirs = ../common

; PD6 debug UART speed (design/driverDevelopment.md §2).
monitor_speed = 115200
