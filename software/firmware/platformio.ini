; PlatformIO project for the wire encoder Modbus interface — product firmware.
; Target MCU: CH32V003J4M6 (RISC-V, SOIC-8, 16KB flash / 2KB RAM)
;
; Measures window opening with a draw-wire encoder whose drum turns a 10 kΩ
; potentiometer, read ratiometrically on PA2 (TDS §3.4).
;
; Framework: ch32v003fun — the framework the carried-over driver libraries were
; developed and HIL-verified on (design/integrationPlan.md §2). ONE release
; build (TDS FR-S01): there is one sensor read one way, so there is nothing to
; select at compile time. The optional environments below are not product
; variants — they add a bench-only or hardware-dependent feature.
;
; Driver libraries are referenced IN PLACE from software/drivers/ — no copies
; (integrationPlan.md §3). Flash with a WCH-LinkE on SWIO (PD1).
;
; NOTE: ../drivers/wire_encoder/lib is deliberately NOT in lib_extra_dirs. That
; library is an unimplemented API contract (we.h with no we.c); adding it before
; the driver exists would only produce a link error at the point where the
; measurement service is written. Add it in integration stage D.

[platformio]
default_envs = encoder
src_dir = src

[env]
platform      = ch32v
board         = genericCH32V003J4M6
framework     = ch32v003fun
upload_protocol = wch-link

; NFR-RES01 ceilings as hard build gates: 87.5% of 16K flash / 2K RAM.
board_upload.maximum_size = 14336
board_upload.maximum_ram_size = 1792

; Verified driver libraries, referenced in place.
lib_extra_dirs =
    ../drivers/common
    ../drivers/modbus_rtu/lib

build_flags =
    -Os
    -Wall
    -Wextra

; ---------------------------------------------------------------------------
; THE RELEASE BUILD. Build byte 0x01, address 40 (jumper open) / 45 (bridged).
; ---------------------------------------------------------------------------
[env:encoder]
build_flags =
    ${env.build_flags}

; Optional end-of-travel switch input on PC1 — the only spare pin on the
; package (TDS §4.2/§3.5). Fit this only when the mechanism has the switches;
; the release build above is complete and conforming without it, and reports
; status bit 3 as 0 (FR-S33).
[env:encoder_endswitch]
build_flags =
    ${env.build_flags}
    -D HAVE_END_SWITCH

; Test build: TEST_HOOKS adds the FR-S20 watchdog hang trigger (holding
; 0x00FF, magic 0xDEAD). NEVER release this binary.
[env:encoder_test]
build_flags =
    ${env.build_flags}
    -D TEST_HOOKS
